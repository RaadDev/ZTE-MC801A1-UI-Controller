<svg xmlns="http://www.w3.org/2000/svg" width="460" height="52" viewBox="0 0 460 52" fill="none">
  <defs>
    <linearGradient id="bg-grad-setup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="tag-grad-setup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="shadow-s" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Box with Shadow -->
  <rect x="2" y="2" width="456" height="48" rx="10" fill="url(#bg-grad-setup)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" filter="url(#shadow-s)" />

  <!-- Left Side Tag (Executable Name) -->
  <rect x="6" y="6" width="150" height="40" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1" />
  <text x="81" y="31" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Arabic', Tahoma, sans-serif" font-size="12" font-weight="600" letter-spacing="0.2" text-anchor="middle">mowajjih-setup.exe</text>

  <!-- Right Side Content (Arabic Title + Windows Icon) -->
  <!-- Windows Icon -->
  <g transform="translate(426, 17) scale(0.9)">
    <path d="M0 2.5L7.5 1.4V8.5H0V2.5ZM0 9.7H7.5V16.8L0 15.7V9.7ZM8.7 1.2L18 0V8.5H8.7V1.2ZM8.7 9.7H18V18L8.7 16.7V9.7Z" fill="#ffffff" />
  </g>

  <!-- Arabic Title -->
  <text x="415" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Arabic', Tahoma, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">
    تثبيت على الجهاز (مع اختصار سطح المكتب)
  </text>
</svg>
